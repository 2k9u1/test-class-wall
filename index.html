<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>우리 반 담벼락</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📌</text></svg>">
  <style>
    body { font-family: sans-serif; margin: 20px; }
    h1 { font-size: 24px; }
    .notice { background: #ffe9e9; padding: 10px; }

    /* 로그인 버튼이 들어올 자리 */
    #userArea { margin: 10px 0; color: #666; }

    /* 메모 쓰는 칸 */
    #writer { margin: 16px 0; }
    #writer textarea { width: 400px; font-size: 16px; }

    /* 메모가 붙는 담벼락 */
    #wall { display: flex; flex-wrap: wrap; gap: 10px; }
    .memo { border: 1px solid #ddd; background: #fffde7; padding: 10px; width: 220px; font-size: 15px; border-radius: 6px; box-sizing: border-box; }
    .memo button.del-btn { float: right; border: none; background: none; font-size: 16px; cursor: pointer; color: #888; }
    .memo button.del-btn:hover { color: #e53935; }
    .memo .memo-content { margin-bottom: 8px; line-height: 1.4; word-break: break-word; }
    .memo .ai-btn { font-size: 12px; padding: 3px 6px; cursor: pointer; background: #e8f4fd; border: 1px solid #90caf9; border-radius: 4px; color: #1565c0; margin-top: 6px; }
    .memo .ai-btn:hover { background: #bbdefb; }
    .ai-comment { background: #f0f7ff; border-left: 3px solid #1976d2; padding: 6px 8px; font-size: 13px; color: #333; border-radius: 2px; margin-top: 8px; line-height: 1.4; word-break: break-word; }
    .ai-comment-header { font-weight: bold; color: #1565c0; font-size: 11px; margin-bottom: 3px; }
    #teacherActions { margin: 10px 0; }
    .teacher-batch-btn { background: #e3f2fd; border: 1px solid #64b5f6; padding: 6px 12px; border-radius: 4px; color: #0d47a1; font-weight: bold; cursor: pointer; }
    .teacher-batch-btn:hover { background: #bbdefb; }
  </style>
</head>
<body>

  <h1>우리 반 담벼락</h1>


  <!-- 사용자 정보 및 구글 로그인/로그아웃 버튼 영역 (app.js가 렌더링) -->
  <div id="userArea"></div>

  <div id="writer">
    <textarea id="input" rows="3" placeholder="메모를 쓰고 엔터 (5글자 이상)"></textarea>
    <div>
      <button id="submitBtn" style="margin-top: 6px; padding: 6px 14px; font-size: 14px; cursor: pointer; border-radius: 4px; border: 1px solid #ccc; background: #fafafa;">메모 올리기</button>
    </div>
  </div>

  <!-- 교사용 액션 영역 (전체 AI 코멘트 달기 등) -->
  <div id="teacherActions"></div>

  <!-- 메모는 app.js가 그립니다 -->
  <div id="wall"></div>

  <!--
    type="module" 로 불러옵니다.
    Firebase SDK가 import 문법이라, 백엔드 시간에 이 방식이어야 붙일 수 있습니다.
  -->
  <script type="module" src="app.js"></script>
</body>
</html>
